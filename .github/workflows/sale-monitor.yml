name: Sale Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Sale Monitor
        run: npm run sale-monitor

      - name: Upload result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sale-monitor-result
          path: tmp/sale-monitor/result.json
          retention-days: 7
