name: Sale Monitor

on:
  schedule:
    # 毎日 日本時間 0:30 (UTC 15:30) と 9:30 (UTC 0:30) に自動実行
    - cron: '30 0,15 * * *'
  workflow_dispatch:
    inputs:
      asin:
        description: '単発テスト用のASIN（空欄の場合はWordPressのpet_product全件をチェックして自動更新）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Sale Monitor
        env:
          ASIN: ${{ inputs.asin }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: npm run sale-monitor
