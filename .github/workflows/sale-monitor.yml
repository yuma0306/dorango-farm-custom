name: Sale Monitor

on:
  workflow_dispatch:
    inputs:
      asin:
        description: '監視対象のAmazon ASIN（デフォルト: B08KQTJ8CN = ヒーティングトップ M）'
        required: false
        default: 'B08KQTJ8CN'
        type: string

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Sale Monitor
        env:
          ASIN: ${{ inputs.asin || 'B08KQTJ8CN' }}
        run: npm run sale-monitor
